<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250">
  <rect x="6" y="6" width="868" height="238" rx="14" fill="#faf6ed" stroke="#262626" stroke-width="2.8"/>
  <rect x="12" y="12" width="856" height="226" rx="10" fill="none" stroke="#262626" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.4"/>

  <text x="45" y="44" fill="#1c1917" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="22" font-weight="bold">
    BEFORE &amp; AFTER: Adding a simple Rate Limiter
  </text>
  <path d="M 45 52 Q 280 56, 560 50 T 830 53" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Box Left: Without Zeus -->
  <g transform="translate(45, 75)">
    <path d="M 0 0 L 380 2 L 377 150 L 3 148 Z" fill="#ffffff" stroke="#ef4444" stroke-width="2.4"/>
    <!-- Red Cross path -->
    <path d="M 22 20 L 32 30 M 32 20 L 22 30" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <text x="40" y="28" fill="#dc2626" font-family="'Segoe Print', cursive" font-size="15" font-weight="bold">WITHOUT ZEUS (Standard Agent)</text>
    <text x="25" y="66" fill="#1c1917" font-family="'Segoe Print', cursive" font-size="24" font-weight="bold">+142 lines of code</text>
    
    <circle cx="30" cy="92" r="3" fill="#dc2626"/>
    <text x="40" y="96" fill="#57534e" font-family="'Segoe Print', cursive" font-size="14">2 npm packages installed (Redis + factory)</text>
    
    <circle cx="30" cy="118" r="3" fill="#dc2626"/>
    <text x="40" y="122" fill="#78716c" font-family="'Segoe Print', cursive" font-size="13">4 config files, crash on network drop</text>
  </g>

  <!-- Box Right: With Zeus -->
  <g transform="translate(455, 75)">
    <path d="M 0 0 L 380 3 L 378 150 L 2 147 Z" fill="#ffffff" stroke="#0284c7" stroke-width="2.6"/>
    <!-- Blue Check path -->
    <path d="M 20 25 L 26 31 L 36 18" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <text x="42" y="28" fill="#0284c7" font-family="'Segoe Print', cursive" font-size="15" font-weight="bold">WITH ZEUSDEVELOPER</text>
    <text x="25" y="66" fill="#b45309" font-family="'Segoe Print', cursive" font-size="24" font-weight="bold">16 lines of code (-88.7%)</text>
    
    <circle cx="30" cy="92" r="3" fill="#0284c7"/>
    <text x="40" y="96" fill="#0369a1" font-family="'Segoe Print', cursive" font-size="14">ZERO dependencies (Native standard library)</text>
    
    <circle cx="30" cy="118" r="3" fill="#0284c7"/>
    <text x="40" y="122" fill="#15803d" font-family="'Segoe Print', cursive" font-size="13">Bounded memory + 1 unit test included</text>
  </g>
</svg>
