<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="880" height="240" rx="16" fill="url(#bgGrad4)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtitle -->
  <text x="40" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SURGICAL IMPLEMENTATION VS ACCIDENTAL COMPLEXITY</text>
  <text x="40" y="70" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">
    Case study: User Rate Limiter middleware
  </text>

  <!-- Left: Before -->
  <g transform="translate(40, 95)">
    <rect width="385" height="115" rx="10" fill="#0b0f19" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="20" y="30" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">WITHOUT ZEUS (Standard Agent)</text>
    <text x="20" y="58" fill="#f1f5f9" font-family="monospace" font-size="20" font-weight="800">+142 lines of code</text>
    <text x="20" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">+2 npm packages (Redis middleware + factory)</text>
    <text x="20" y="100" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">4 extra config files, unhandled connection failure</text>
  </g>

  <!-- Right: After -->
  <g transform="translate(455, 95)">
    <rect width="385" height="115" rx="10" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="20" y="30" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">WITH ZEUSDEVELOPER ⚡</text>
    <text x="20" y="58" fill="#fbbf24" font-family="monospace" font-size="20" font-weight="800">16 lines of code (-88.7%)</text>
    <text x="20" y="82" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">0 dependencies (Native bounded Map)</text>
    <text x="20" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Bounded memory, race-immune, verified unit test</text>
  </g>
</svg>
