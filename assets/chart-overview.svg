<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390">
  <defs>
    <!-- Paper filter / sketch texture -->
    <filter id="sketchPaper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fff" surfaceScale="1" result="light">
        <feDistantLight azimuth="45" elevation="60" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
  </defs>

  <!-- Cream Paper Background with hand-drawn rough border -->
  <rect x="6" y="6" width="868" height="378" rx="14" fill="#faf6ed" stroke="#262626" stroke-width="2.8"/>
  <rect x="12" y="12" width="856" height="366" rx="10" fill="none" stroke="#262626" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Sketch Title -->
  <text x="45" y="48" fill="#1c1917" font-family="'Segoe Print', 'Comic Sans MS', 'Caveat', cursive, sans-serif" font-size="24" font-weight="bold">
    ⚡ BENCHMARK: ZeusDeveloper vs Standard AI (40 tasks)
  </text>
  <!-- Hand-drawn underline -->
  <path d="M 45 56 Q 260 62, 520 54 T 780 58" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

  <!-- Metric 1: Lines of code -->
  <text x="45" y="112" fill="#292524" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold">Lines of Code:</text>
  <!-- Baseline rough bar -->
  <path d="M 230 96 L 680 97 L 678 116 L 228 115 Z" fill="#e7e5e4" stroke="#262626" stroke-width="2.2"/>
  <text x="690" y="112" fill="#78716c" font-family="'Segoe Print', cursive" font-size="14">100% (bloat!)</text>
  <!-- Zeus hand-drawn highlighter bar -->
  <path d="M 230 124 L 385 125 L 383 146 L 228 144 Z" fill="#fde047" stroke="#262626" stroke-width="2.4"/>
  <!-- Sketch doodle fill lines -->
  <path d="M 245 126 L 240 144 M 275 126 L 270 144 M 305 126 L 300 144 M 335 126 L 330 144 M 365 126 L 360 144" stroke="#eab308" stroke-width="2"/>
  <text x="395" y="142" fill="#b45309" font-family="'Segoe Print', cursive" font-size="15" font-weight="bold">35% &rarr; -65% less code!</text>

  <!-- Metric 2: Output Tokens -->
  <text x="45" y="186" fill="#292524" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold">Output Tokens:</text>
  <path d="M 230 170 L 680 171 L 678 190 L 228 189 Z" fill="#e7e5e4" stroke="#262626" stroke-width="2.2"/>
  <text x="690" y="186" fill="#78716c" font-family="'Segoe Print', cursive" font-size="14">100% (filler prose)</text>
  <!-- Zeus bar -->
  <path d="M 230 198 L 350 199 L 348 220 L 228 218 Z" fill="#38bdf8" stroke="#262626" stroke-width="2.4"/>
  <path d="M 245 200 L 240 218 M 275 200 L 270 218 M 305 200 L 300 218 M 335 200 L 330 218" stroke="#0284c7" stroke-width="2"/>
  <text x="360" y="216" fill="#0369a1" font-family="'Segoe Print', cursive" font-size="15" font-weight="bold">28% &rarr; -72% tokens saved!</text>

  <!-- Metric 3: API Cost -->
  <text x="45" y="260" fill="#292524" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold">API Cost ($):</text>
  <path d="M 230 244 L 680 245 L 678 264 L 228 263 Z" fill="#e7e5e4" stroke="#262626" stroke-width="2.2"/>
  <text x="690" y="260" fill="#78716c" font-family="'Segoe Print', cursive" font-size="14">100% ($$$)</text>
  <!-- Zeus bar -->
  <path d="M 230 272 L 455 273 L 452 294 L 228 292 Z" fill="#f87171" stroke="#262626" stroke-width="2.4"/>
  <path d="M 250 274 L 245 292 M 290 274 L 285 292 M 330 274 L 325 292 M 370 274 L 365 292 M 410 274 L 405 292" stroke="#dc2626" stroke-width="2"/>
  <text x="465" y="290" fill="#b91c1c" font-family="'Segoe Print', cursive" font-size="15" font-weight="bold">50% &rarr; half the cost!</text>

  <!-- Metric 4: Turnaround Time -->
  <text x="45" y="334" fill="#292524" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold">Time to Fix:</text>
  <path d="M 230 318 L 680 319 L 678 338 L 228 337 Z" fill="#e7e5e4" stroke="#262626" stroke-width="2.2"/>
  <text x="690" y="334" fill="#78716c" font-family="'Segoe Print', cursive" font-size="14">100% (slow)</text>
  <!-- Zeus bar -->
  <path d="M 230 346 L 430 347 L 428 368 L 228 366 Z" fill="#fde047" stroke="#262626" stroke-width="2.4"/>
  <text x="440" y="364" fill="#b45309" font-family="'Segoe Print', cursive" font-size="15" font-weight="bold">45% &rarr; 2x faster!</text>

  <!-- Hand-drawn Arrow & Note -->
  <path d="M 740 330 Q 770 280, 750 220" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 745 225 L 750 220 L 758 228" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <text x="735" y="210" fill="#dc2626" font-family="'Segoe Print', cursive" font-size="13" font-weight="bold" transform="rotate(-6 735 210)">Surgical!</text>
</svg>
