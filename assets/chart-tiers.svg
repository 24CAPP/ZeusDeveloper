<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290">
  <rect x="6" y="6" width="868" height="278" rx="14" fill="#faf6ed" stroke="#262626" stroke-width="2.8"/>
  <rect x="12" y="12" width="856" height="266" rx="10" fill="none" stroke="#262626" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.4"/>

  <text x="45" y="44" fill="#1c1917" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="22" font-weight="bold">
    HOW MANY TOKENS EACH TIER USES (Per single answer)
  </text>
  <path d="M 45 52 Q 300 56, 600 50 T 830 53" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Row 1: Standard AI -->
  <text x="45" y="100" fill="#292524" font-family="'Segoe Print', cursive" font-size="15" font-weight="bold">Standard AI:</text>
  <path d="M 230 84 L 670 85 L 668 106 L 228 105 Z" fill="#e7e5e4" stroke="#262626" stroke-width="2.2"/>
  <text x="680" y="101" fill="#78716c" font-family="'Segoe Print', cursive" font-size="14">130 tokens (chatty)</text>

  <!-- Row 2: Hermes -->
  <text x="45" y="146" fill="#292524" font-family="'Segoe Print', cursive" font-size="15" font-weight="bold">/zeus hermes:</text>
  <path d="M 230 130 L 440 131 L 438 152 L 228 151 Z" fill="#7dd3fc" stroke="#262626" stroke-width="2.2"/>
  <text x="450" y="147" fill="#0369a1" font-family="'Segoe Print', cursive" font-size="14" font-weight="bold">62 tokens (-52%)</text>

  <!-- Row 3: Zeus -->
  <text x="45" y="192" fill="#292524" font-family="'Segoe Print', cursive" font-size="15" font-weight="bold">/zeus (default):</text>
  <path d="M 230 176 L 375 177 L 373 198 L 228 197 Z" fill="#fde047" stroke="#262626" stroke-width="2.2"/>
  <text x="385" y="193" fill="#b45309" font-family="'Segoe Print', cursive" font-size="14" font-weight="bold">45 tokens (-65%)</text>

  <!-- Row 4: Oracle -->
  <text x="45" y="238" fill="#dc2626" font-family="'Segoe Print', cursive" font-size="15" font-weight="bold">/zeus oracle:</text>
  <path d="M 230 222 L 325 223 L 323 244 L 228 243 Z" fill="#fca5a5" stroke="#dc2626" stroke-width="2.6"/>
  <text x="335" y="239" fill="#dc2626" font-family="'Segoe Print', cursive" font-size="15" font-weight="bold">28 tokens (-78.5% SAVED!)</text>

  <!-- Doodle badge -->
  <rect x="715" y="222" width="135" height="26" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" transform="rotate(-3 780 235)"/>
  <text x="725" y="240" fill="#dc2626" font-family="'Segoe Print', cursive" font-size="13" font-weight="bold" transform="rotate(-3 780 235)">Ultra-dense mode</text>
</svg>
